schema_version: 1

context:
  version: "19.0.0"

package:
  name: ltex-ls
  version: ${{ version }}

source:
  url: https://github.com/ltex-plus/ltex-ls-plus/archive/refs/tags/${{ version }}.tar.gz
  sha256: f0f11b729bc93678d4747b3998fd056459afa8ff6d8a98e4de031bdb9ee7648f

build:
  number: 0
  noarch: generic

requirements:
  host:
    - maven
    - openjdk
    - python =${{ python_min }}
    - sed
  run:
    - openjdk
    - python >=${{ python_min }}

tests:
  - script:
      - ltex-ls --help
      - ltex-cli --help
      - ltex-ls-plus --help
      - ltex-cli-plus --help

about:
  license: MPL-2.0
  license_file:
    - LICENSE.md
    - target/generated-resources/licenses/
  summary: LSP language server for LanguageTool with support for LaTeX, Markdown, and others
  homepage: https://github.com/valentjn/ltex-ls

extra:
  recipe-maintainers:
    - danielnachun
